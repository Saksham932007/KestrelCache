name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The crash-consistency tests kill a child process with SIGKILL and then assert that every
      # acknowledged write came back, so they need the whole solution built (they launch the CLI)
      # and a scratch directory on a real filesystem. The suite picks a disk-backed path by
      # default and skips its timing-sensitive assertions if it detects a RAM disk.
      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/test-results
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          directory: ./artifacts/test-results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build --configuration Release

      # A short run, so a benchmark that stops compiling or starts throwing fails the build.
      # Published figures come from a dedicated machine, never from a shared CI runner: the
      # numbers a noisy-neighbour VM produces are not comparable between runs.
      - name: Run the latency suite briefly
        run: >
          dotnet ./benchmarks/KestrelCache.Benchmarks/bin/Release/net9.0/kestrel-bench.dll
          latency --root "${{ runner.temp }}/kestrel-bench" --ops 2000

  container:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t kestrelcache:ci .

      # A built image that does not serve is not a built image. This starts the container, waits
      # for the health endpoint, and drives it with the real redis-cli -- which is the whole
      # compatibility claim, verified rather than asserted.
      - name: Start the server
        run: |
          docker run -d --name kestrelcache-ci -p 6380:6380 -p 9180:9180 kestrelcache:ci
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9180/health > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9180/health

      - name: Exercise it with the real redis-cli
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli -p 6380 "$@"; }
          test "$(cli PING)" = "PONG"
          test "$(cli SET ci-key ci-value)" = "OK"
          test "$(cli GET ci-key)" = "ci-value"
          test "$(cli INCR ci-counter)" = "1"
          test "$(cli MSET a 1 b 2)" = "OK"
          cli KEYS '*'
          cli INFO engine

          # Flush the memtable, which is also what makes kestrelcache_engine_sstables exist:
          # the gauge is emitted per level, so a tree that has never flushed exports a bare
          # header and no series, and the metrics check below would look for a name that is
          # legitimately absent.
          cli COMPACT
          echo "redis-cli compatibility verified"

      # Locks in "refuse, do not ignore". Both compose files passed every flag as --name=value,
      # which the parser did not understand and the switch silently discarded, so the clustered
      # stack ran as three unrelated single-node servers and the single-node stack only looked
      # correct because every value it passed happened to equal the default.
      - name: A bad option is refused rather than ignored
        run: |
          out=$(docker run --rm --entrypoint /app/kestrel-server kestrelcache:ci --nonsense 2>&1) \
            && { echo "a bogus option was accepted: $out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "unknown option --nonsense" \
            || { echo "unexpected message: $out"; exit 1; }

          out=$(docker run --rm --entrypoint /app/kestrel-server kestrelcache:ci --port 2>&1) \
            && { echo "a valueless option was accepted: $out"; exit 1; }
          echo "$out" | grep -q "requires a value" \
            || { echo "unexpected message: $out"; exit 1; }
          echo "bad options are refused"

      - name: Confirm the metrics endpoint exports what the dashboard queries
        run: |
          metrics=$(curl -sf http://127.0.0.1:9180/metrics)
          for name in \
            kestrelcache_up \
            kestrelcache_commands_total \
            kestrelcache_command_duration_seconds_bucket \
            kestrelcache_engine_sstables \
            kestrelcache_engine_bloom_negatives_total \
            kestrelcache_engine_block_cache_hit_rate \
            kestrelcache_engine_wal_bytes
          do
            echo "$metrics" | grep -q "^$name" || { echo "missing metric: $name"; exit 1; }
          done
          echo "all dashboard metrics present"

      - name: Check that it shuts down cleanly
        run: |
          # SIGTERM must produce an orderly stop with a final fsync, not a kill. A non-zero exit
          # code here means the shutdown path threw, which in a container reads as a crash loop.
          docker stop --time 20 kestrelcache-ci
          code=$(docker inspect -f '{{.State.ExitCode}}' kestrelcache-ci)
          docker logs kestrelcache-ci
          test "$code" = "0" || { echo "unclean shutdown, exit code $code"; exit 1; }
          echo "shut down cleanly"

      - name: Clean up
        if: always()
        run: docker rm -f kestrelcache-ci || true

  compose:
    name: compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180

      - name: Verify Prometheus is scraping the database
        run: |
          for _ in $(seq 1 30); do
            health=$(curl -s http://127.0.0.1:9090/api/v1/targets \
              | python3 -c "import json,sys;print(next((t['health'] for t in json.load(sys.stdin)['data']['activeTargets'] if t['labels']['job']=='kestrelcache'),'absent'))")
            if [ "$health" = "up" ]; then echo "target up"; exit 0; fi
            sleep 2
          done
          curl -s http://127.0.0.1:9090/api/v1/targets
          echo "Prometheus never scraped the database successfully"
          exit 1

      - name: Verify Grafana provisioned the datasource and dashboard
        run: |
          for _ in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/datasources | grep -q kestrelcache-prometheus
          curl -sf "http://127.0.0.1:3000/api/dashboards/uid/kestrelcache-overview" | grep -q '"title": *"KestrelCache"'
          echo "Grafana provisioning verified"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v || true

  cluster:
    name: replicated cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring a three-node cluster up
        run: >
          docker compose -f deploy/docker-compose.cluster.yml up -d --build
          --wait --wait-timeout 240 kc1 kc2 kc3

      # The whole point of consensus is that exactly one node leads. Asserting it from outside is
      # the cheapest check that the cluster actually formed rather than three nodes campaigning
      # at each other forever.
      - name: Wait for exactly one leader
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          for _ in $(seq 1 60); do
            leaders=0
            for p in 6381 6382 6383; do
              if cli -p $p cluster info 2>/dev/null | grep -q 'role:leader'; then
                leaders=$((leaders + 1))
                leader_port=$p
              fi
            done
            if [ "$leaders" = "1" ]; then
              echo "one leader, on port $leader_port"
              echo "LEADER_PORT=$leader_port" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          for p in 6381 6382 6383; do echo "--- $p ---"; cli -p $p cluster info || true; done
          echo "the cluster never settled on a single leader"
          exit 1

      - name: Writes replicate to every node
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          test "$(cli -p "$LEADER_PORT" SET replicated yes)" = "OK"
          sleep 2
          for p in 6381 6382 6383; do
            got=$(cli -p $p GET replicated)
            test "$got" = "yes" || { echo "port $p has '$got', expected 'yes'"; exit 1; }
          done
          echo "replicated to all three nodes"

      - name: A follower refuses writes and names the leader
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          for p in 6381 6382 6383; do
            if [ "$p" != "$LEADER_PORT" ]; then
              reply=$(cli -p $p SET viaFollower nope)
              echo "follower on $p replied: $reply"
              echo "$reply" | grep -q NOTLEADER || { echo "expected -NOTLEADER"; exit 1; }
              exit 0
            fi
          done

      # Killing the leader is the test that matters. A cluster that cannot elect a replacement is
      # strictly worse than a single node, since it has the same availability and three times the
      # hardware.
      - name: Killing the leader elects a new one, with data intact
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          case "$LEADER_PORT" in
            6381) victim=kc1 dead=n1 ;;
            6382) victim=kc2 dead=n2 ;;
            *)    victim=kc3 dead=n3 ;;
          esac
          echo "killing $victim"
          docker compose -f deploy/docker-compose.cluster.yml kill "$victim"

          for _ in $(seq 1 60); do
            for p in 6381 6382 6383; do
              [ "$p" = "$LEADER_PORT" ] && continue
              if cli -p $p cluster info 2>/dev/null | grep -q 'role:leader'; then
                echo "new leader on port $p"
                test "$(cli -p $p GET replicated)" = "yes" \
                  || { echo "data written before the failure was lost"; exit 1; }
                test "$(cli -p $p SET afterFailover yes)" = "OK" \
                  || { echo "the new leader will not accept writes"; exit 1; }

                # Every later step addresses the leader, and the one this job started with is
                # now the container we just killed. Publish the replacement, and which node is
                # down, so that nothing downstream talks to a dead port or picks it as a victim.
                echo "LEADER_PORT=$p" >> "$GITHUB_ENV"
                echo "DEAD_NODE=$dead" >> "$GITHUB_ENV"

                echo "failover verified"
                exit 0
              fi
            done
            sleep 2
          done
          echo "no new leader was elected after the old one was killed"
          exit 1

      # The pre-vote assertion, and the reason the feature exists. The node killed above has
      # been out long enough to have heard from no leader, so in ordinary Raft it would time
      # out on rejoining, increment its term, and force an election it cannot win -- its log is
      # behind. Pre-vote has it ask first, and a majority that has just heard from a healthy
      # leader says no. The observable consequence is that nothing moves.
      - name: A rejoining node does not disturb the cluster
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          field() { grep -oP "$1:\K.*" | tr -d '[:space:]'; }

          case "$DEAD_NODE" in
            n1) revived=kc1 revived_port=6381 ;;
            n2) revived=kc2 revived_port=6382 ;;
            *)  revived=kc3 revived_port=6383 ;;
          esac

          term_before=$(cli -p "$LEADER_PORT" CLUSTER INFO | field term)
          echo "leader on $LEADER_PORT at term ${term_before}; restarting ${revived}"

          docker compose -f deploy/docker-compose.cluster.yml start "$revived"

          # Several election timeouts. If the rejoining node is going to disrupt anything it
          # will have done so well inside this window.
          sleep 20

          term_after=$(cli -p "$LEADER_PORT" CLUSTER INFO | field term)
          role_after=$(cli -p "$LEADER_PORT" CLUSTER INFO | field role)

          echo "--- rejoined node ---"
          cli -p "$revived_port" CLUSTER INFO | grep -E 'role|term|leader|pre_votes|elections' || true

          test "$term_after" = "$term_before" \
            || { echo "the term moved ${term_before} -> ${term_after}: the rejoining node forced an election"; exit 1; }
          test "$role_after" = "leader" \
            || { echo "the leader on $LEADER_PORT stepped down to ${role_after}"; exit 1; }

          # And it is a real member again, not merely quiet: it must be following and caught up
          # on data committed while it was down.
          for _ in $(seq 1 30); do
            r=$(cli -p "$revived_port" CLUSTER INFO | field role)
            test "$r" = "follower" && break
            sleep 2
          done
          test "$(cli -p "$revived_port" GET afterFailover)" = "yes" \
            || { echo "the rejoining node did not catch up on what it missed"; exit 1; }

          # Everything downstream can treat the cluster as whole again.
          echo "DEAD_NODE=" >> "$GITHUB_ENV"
          echo "rejoin without disruption verified: term held at ${term_after}"

      - name: Snapshotting truncates the log and keeps the data
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          for i in $(seq 1 200); do cli -p "$LEADER_PORT" SET "key:$i" "value-$i" > /dev/null; done

          before=$(cli -p "$LEADER_PORT" CLUSTER INFO | grep -oP 'log_entries:\K[0-9]+')
          cli -p "$LEADER_PORT" CLUSTER SNAPSHOT
          after=$(cli -p "$LEADER_PORT" CLUSTER INFO | grep -oP 'log_entries:\K[0-9]+')
          snapshot=$(cli -p "$LEADER_PORT" CLUSTER INFO | grep -oP 'snapshot_index:\K[0-9]+')

          echo "log entries $before -> $after, snapshot at index $snapshot"
          test "$after" -lt "$before" || { echo "the log was not truncated"; exit 1; }
          test "$snapshot" -gt 0 || { echo "no snapshot was taken"; exit 1; }

          # The whole point: truncating the history must not lose the state it produced.
          test "$(cli -p "$LEADER_PORT" GET key:1)" = "value-1"
          test "$(cli -p "$LEADER_PORT" GET key:200)" = "value-200"
          echo "snapshotting verified"

      # A server added after the leader has discarded its log can only be caught up by a state
      # transfer, so this exercises InstallSnapshot as well as the learner path. The assertion
      # worth making here is the one the feature exists for: admitting a learner must not move
      # quorum_size, because a cluster that needed two votes before the change still needs two
      # during it. Promotion is what pays the cost, and it is paid against a node already current.
      - name: A server joins as a learner, is snapshotted, and is promoted
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }
          info() { cli -p "$1" CLUSTER INFO; }
          field() { grep -oP "$1:\K.*" | tr -d '[:space:]'; }

          docker compose -f deploy/docker-compose.cluster.yml --profile grow \
            up -d --wait --wait-timeout 120 kc4

          # No voters until it is admitted, so it cannot elect itself.
          voters=$(info 6384 | field voters || true)
          echo "n4 voters before joining: '${voters}'"
          test -z "$voters" || { echo "a joining server must start with no voters"; exit 1; }

          quorum_before=$(info "$LEADER_PORT" | field quorum_size)
          echo "quorum before admitting n4: ${quorum_before}"

          cli -p "$LEADER_PORT" CLUSTER ADDLEARNER n4 kc4:7380

          for _ in $(seq 1 60); do
            got=$(info 6384 | field learners || true)
            case "$got" in *n4*) break ;; esac
            sleep 2
          done

          info "$LEADER_PORT" | grep -E 'voters|learners|quorum_size|learner_lag'

          # The whole point: a learner is in no quorum, so the cluster's failure tolerance is
          # exactly what it was before the change.
          quorum_learner=$(info "$LEADER_PORT" | field quorum_size)
          test "$quorum_learner" = "$quorum_before" \
            || { echo "admitting a learner moved quorum_size ${quorum_before} -> ${quorum_learner}"; exit 1; }

          # It must not be a voter, and it must not be campaigning.
          voters=$(info "$LEADER_PORT" | field voters)
          case "$voters" in *n4*) echo "a learner must not be a voter: ${voters}"; exit 1 ;; esac

          installed=$(info 6384 | field snapshots_installed)
          test "$installed" -gt 0 || { echo "n4 was not caught up by a snapshot"; exit 1; }

          # Data written long before n4 existed, which can only have arrived in the snapshot.
          test "$(cli -p 6384 GET key:1)" = "value-1"
          test "$(cli -p 6384 GET key:200)" = "value-200"

          # Wait for it to be current before promoting, which is the sequence the docs recommend.
          for _ in $(seq 1 60); do
            lag=$(info "$LEADER_PORT" | grep -oP 'learner_lag_n4:\K[0-9]+' || echo 999)
            test "$lag" -le 1 && break
            sleep 2
          done
          echo "n4 lag at promotion: ${lag}"

          cli -p "$LEADER_PORT" CLUSTER PROMOTE n4

          for _ in $(seq 1 60); do
            got=$(info "$LEADER_PORT" | field voters)
            case "$got" in *n4*) break ;; esac
            sleep 2
          done

          info "$LEADER_PORT" | grep -E 'voters|learners|quorum_size'

          voters=$(info "$LEADER_PORT" | field voters)
          case "$voters" in *n4*) ;; *) echo "n4 was not promoted: ${voters}"; exit 1 ;; esac

          learners=$(info "$LEADER_PORT" | field learners || true)
          test -z "$learners" || { echo "n4 is still a learner: ${learners}"; exit 1; }

          # Promotion is what moves the quorum, and now it should have.
          quorum_after=$(info "$LEADER_PORT" | field quorum_size)
          test "$quorum_after" -gt "$quorum_learner" \
            || { echo "promotion did not raise quorum_size from ${quorum_learner}"; exit 1; }

          # A promoted learner is a full voter: the cluster still commits under the new quorum.
          cli -p "$LEADER_PORT" SET after-promotion yes
          test "$(cli -p "$LEADER_PORT" GET after-promotion)" = "yes"
          echo "learner admission and promotion verified"

      - name: A server can be removed from a running cluster
        run: |
          cli() { docker run --rm --network host redis:7-alpine redis-cli "$@"; }

          # Remove a node that is neither the leader -- so the removal does not trigger an
          # election mid-test -- nor the one killed earlier, which is still down: removing a
          # dead node would work, but it would not demonstrate that a live member steps out of
          # the configuration cleanly, which is the interesting case.
          case "$LEADER_PORT" in
            6381) self=n1 ;; 6382) self=n2 ;; 6383) self=n3 ;; *) self=n4 ;;
          esac
          victim=
          for candidate in n1 n2 n3 n4; do
            [ "$candidate" = "$self" ] && continue
            [ "$candidate" = "$DEAD_NODE" ] && continue
            victim=$candidate
            break
          done
          test -n "$victim" || { echo "no removable node"; exit 1; }
          echo "leader is $self, removing $victim (down: ${DEAD_NODE:-none})"

          cli -p "$LEADER_PORT" CLUSTER REMOVENODE "$victim"

          for _ in $(seq 1 60); do
            got=$(cli -p "$LEADER_PORT" CLUSTER INFO | grep -oP 'voters:\K.*' | tr -d '[:space:]')
            case "$got" in *"$victim"*) sleep 2 ;; *) echo "voters are now $got"; break ;; esac
          done

          got=$(cli -p "$LEADER_PORT" CLUSTER INFO | grep -oP 'voters:\K.*' | tr -d '[:space:]')
          case "$got" in
            *"$victim"*) echo "$victim is still a voter"; exit 1 ;;
          esac

          # The smaller cluster still accepts writes.
          test "$(cli -p "$LEADER_PORT" SET afterRemoval yes)" = "OK"
          echo "runtime removal verified"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.cluster.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.cluster.yml down -v || true

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
