name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # The crash-consistency tests kill a child process with SIGKILL and then assert that every
      # acknowledged write came back, so they need the whole solution built (they launch the CLI)
      # and a scratch directory on a real filesystem. The suite picks a disk-backed path by
      # default and skips its timing-sensitive assertions if it detects a RAM disk.
      - name: Test
        run: >
          dotnet test
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./artifacts/test-results
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          directory: ./artifacts/test-results
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build --configuration Release

      # A short run, so a benchmark that stops compiling or starts throwing fails the build.
      # Published figures come from a dedicated machine, never from a shared CI runner: the
      # numbers a noisy-neighbour VM produces are not comparable between runs.
      - name: Run the latency suite briefly
        run: >
          dotnet ./benchmarks/KestrelCache.Benchmarks/bin/Release/net9.0/kestrel-bench.dll
          latency --root "${{ runner.temp }}/kestrel-bench" --ops 2000

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic
        continue-on-error: true
